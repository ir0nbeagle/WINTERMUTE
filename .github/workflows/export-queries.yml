name: Export Detection Queries

on:
  push:
    branches: [main]
    paths:
      # Query bodies live in *queries.md; LOCK.md changes can flip a hunt's
      # status / detection metadata that the query cards display, so refresh on both.
      - 'hunts/**/*queries.md'
      - 'hunts/**/LOCK.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Export detection queries
        run: python3 -B scripts/export_queries.py

      - name: Commit query library
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exports/queries.json
          git diff --cached --quiet || git commit -m "chore: update detection query library [skip ci]"
          git push
